<footer class="footer mt-4 border-top border-2 py-4">
  <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
      
      <!-- Marca / Información principal -->
      <div class="text-center text-md-start">
        <span class="fw-bold" style="color: var(--mi-acento);">{{ nombreApp }}</span>
        <div class="small" style="color: var(--mi-blanco); opacity: 0.85;">
          {{ trabajoPractico }}
        </div>
      </div>

      <!-- Badges de tecnología (estilo moderno) -->
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <span class="badge px-3 py-2 rounded-pill shadow-sm" 
              style="background-color: var(--mi-blanco); color: var(--mi-azul);">
          Angular 21
        </span>
        <span class="badge px-3 py-2 rounded-pill shadow-sm" 
              style="background-color: var(--mi-blanco); color: var(--mi-azul);">
          Bootstrap 5
        </span>
        <span class="badge px-3 py-2 rounded-pill shadow-sm" 
              style="background-color: var(--mi-blanco); color: var(--mi-azul);">
          Reactive Forms
        </span>
      </div>

      <!-- Copyright y alumno -->
      <div class="text-center text-md-end">
        <div class="small" style="color: var(--mi-blanco); opacity: 0.85;">
          © {{ anioActual }} - {{ nombreAlumno }}
        </div>
        <div class="small" style="color: var(--mi-blanco); opacity: 0.7;">
          Todos los derechos reservados
        </div>
      </div>

    </div>
  </div>
</footer>
